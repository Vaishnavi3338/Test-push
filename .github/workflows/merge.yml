
name: Run on PR merged to master

on:
  workflow_dispatch:

  repository_dispatch:
    types: [externally-triggered-job]

  push:
    branches:
      - master

  workflow_run:
    workflows: ["Auto_PR_for_manifests_branches"]
    types:
      - completed

jobs:
  build:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Switch to master (only for workflow_run)
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          git fetch origin
          git checkout master
          git pull origin master

      - name: Test push
        run: |
          echo "PR was merged into master."

      
      - name: Configure Git identity
        run: |
          git config user.name "Vaishnavi3338"
          git config user.email "vaishnavilakkarusu@gmail.com"

          

      - name: Create new file
        run: |
          echo "sample" > test.txt

      - name: Commit and Push Changes
        run: |
          git add .
          git commit -m "Automated change" || echo "Nothing to commit"
          git push origin master
